# ################################
# YAML: remani_real State Bridge defaults begin
# ################################
state_bridge:
  velocity_estimator:
    min_samples: 3
    max_abs_velocity: 3.0
    alpha: 0.5
    max_dt: 0.2
  status_stale_timeout: 0.5
  # Static display-only joints for RobotModel / RViz. Never copied into
  # /remani/cr10_joint_states planning output.
  display_joint_defaults:
    - {name: fr_steering_joint, position: 0.0, measured: false}
    - {name: fr_wheel_joint, position: 0.0, measured: false}
    - {name: fl_steering_wheel_joint, position: 0.0, measured: false}
    - {name: fl_wheel_joint, position: 0.0, measured: false}
    - {name: rl_steering_wheel_joint, position: 0.0, measured: false}
    - {name: rl_wheel_joint, position: 0.0, measured: false}
    - {name: rr_steering_wheel_joint, position: 0.0, measured: false}
    - {name: rr_wheel_joint, position: 0.0, measured: false}
    - {name: gripper_finger1_joint, position: 0.0, measured: false}
    - {name: gripper_finger2_joint, position: 0.0, measured: false}
# ################################
# YAML: remani_real State Bridge defaults end
# ################################

# ################################
# YAML: remani_real candidate validation defaults begin
# ################################
candidate_validation:
  validation_dt: 0.01
  start_base_xy_tol: 0.05
  start_base_yaw_tol_deg: 5.0
  start_joint_tol_deg: 3.0
  max_base_linear_speed: 0.10
  max_base_angular_speed: 0.15
  max_joint_speed: 0.10
  continuity_pos_tol: 1.0e-4
  continuity_vel_tol: 1.0e-3
  continuity_acc_tol: 1.0e-2
preview:
  path_dt: 0.05
  robot_dt: 0.25
# ################################
# YAML: remani_real candidate validation defaults end
# ################################

# ################################
# YAML: Phase3 base tracking defaults begin
# ################################
base_tracking:
  k_x: 1.0
  k_y: 1.0
  k_yaw: 1.0
  max_linear: 0.10
  max_angular: 0.15
  max_linear_correction: 0.03
  max_angular_correction: 0.05
  max_position_error: 0.20
  max_yaw_error: 0.20
# ################################
# YAML: Phase3 base tracking defaults end
# ################################
