search:
  oneshot_check_len: 0.02  # Interval for checking whether the RS/Debain curve obtained by oneshot collides
  oneshot_range    : 1.0  # oneshot range

  traj_forward_penalty     : 1.0 # Forward penalty coefficient
  traj_back_penalty        : 3.0 # Backward penalty coefficient
  traj_gear_switch_penalty : 10.0  # Penalty for switching between forward and reverse gears
  traj_steer_penalty       : 5.0  # Steering penalty
  traj_steer_change_penalty: 2.0  # Penalty for steering change

  try_astar_times: 5 # Use whole-body RRT after try_astar_times consecutive planning failures

  # ################################
  # YAML: finer yaw for Hybrid A* (was ~180deg / 2 bins) begin
  # ################################
  yaw_resolution    : 0.35   # ~20 deg yaw bins (3.15 left only ~2 bins)
  # ################################
  # YAML: finer yaw for Hybrid A* end
  # ################################
  max_arc           : 0.4    # Maximum forward search displacement
  min_turning_radius: 0.2    # Minimum turning radius
  lambda_heu        : 1      # Coefficient for greedy search, multiplied by h
  max_seach_time    : 3.0    # Hybrid A* budget for Ranger long goals
  check_num         : 16     # Used to check collision when Hybrid A* expands the state
  dist_resolution   : 0.6    # Expected distance between path points given to the backend
  sample_time       : 0.1    # Sampling time when given to the backend
  curvatureDisCoe   : 0.4    # Angle coefficient for time allocation
  allocate_num      : 100000 # Number of allocated nodes (maximum number of nodes visited)

  # manipulator sample
  goal_rate: 0.4             # Probability for RRT to sample the end point
  max_loop_num: 5000         # Maximum number of RRT sampling times
  # ################################
  # YAML: longer arm / whole-body search for CR10 begin
  # ################################
  max_sample_time: 1.50      # Maximum time for whole-body RRT
  max_mani_search_time: 0.30 # Maximum time for manipulator search
  # ################################
  # YAML: longer arm / whole-body search for CR10 end
  # ################################

optimization:
  weight_obstacle          : 50000.0  # Weight for obstacle
  weight_manipulator_obstacle: 80000.0  # Arm-obstacle weight (stronger than base)
  weight_manipulator_self       : 1000.0   # Weight for self collision
  weight_base_feasibility       : 100.0    # Weight for base feasibility
  weight_manipulator_feasibility: 100.0    # Weight for manipulator feasibility
  weight_time                   : 1.0     # Weight for time
  
  ground_safe_dis        : 0.03           # Safe distance from the ground
  safe_margin            : 0.10           # General safe margin
  safe_margin_mani       : 0.15           # Safe margin for the manipulator
  self_safe_margin       : 0.10           # Safe margin for self
  ground_safe_margin     : 0.03           # Safe margin from the ground

  mobile_base_opt_gear: true              # Whether to optimize the gear
  constrain_points_perPiece: 16           # Constraint points per piece
  dense_sample_resolution: 16             # Resolution for dense sampling

  # ################################
  # YAML: dynamic time scaling for wheel/joint feasibility begin
  # ################################
  enable_dynamic_time_scaling: true
  wheel_limit_ratio: 0.95
  max_time_scale: 2.0
  max_time_scaling_attempts: 2
  # ################################
  # YAML: dynamic time scaling for wheel/joint feasibility end
  # ################################
  
fsm:
  target_type  : 2            # 1: manual set 2D goal; 2: preset targets, pass through waypoint in order
  max_continuous_plan_failures: 20  # abort new-task planning after N consecutive failures
  time_for_gripper: 0.05      # Time for the gripper to grip things between path points

  thresh_replan_time: 2.5     # Threshold for replanning time
  replan_trajectory_time: 1.7 # the expected max time of replanning trajectory, greater than max replan time
  planning_horizon: 5.0       # Planning horizon
  global_plan: true           # Whether to use global plan
  emergency_time: 1.5         # greater than max replan time

  # ################################
  # YAML: EE 6D pose goal FSM / IK params begin
  # ################################
  ee_goal_topic: /ee_goal
  ee_current_pose_topic: /ee_current_pose

  ee_ik_pos_tol: 0.01
  ee_ik_rot_tol_deg: 2.0
  ee_reach_pos_tol: 0.02
  ee_reach_rot_tol_deg: 4.0

  ee_ik_local_xy: 0.40
  ee_ik_local_yaw_deg: 20.0
  ee_ik_b_max_iters: 60
  ee_ik_b_max_ms: 40.0
  ee_ik_b_weight_xy: 5.0
  ee_ik_b_weight_yaw: 2.0
  ee_ik_b_weight_joint: 1.0

  ee_ik_b_accept_joint_margin: 0.15
  ee_ik_b_accept_clearance: 0.20
  ee_ik_b_accept_max_xy: 0.15
  ee_ik_b_accept_max_yaw_deg: 10.0
  ee_ik_b_accept_max_dq: 0.50

  ee_ik_c_radii: [0.50, 0.75, 1.00, 1.25]
  ee_ik_c_yaw_bins: 12
  ee_ik_c_yaw_offsets_deg: [0.0, -15.0, 15.0]
  ee_ik_c_arm_iters: 40
  ee_ik_c_arm_max_ms: 5.0
  ee_ik_c_max_ms: 150.0

  ee_ik_w_xy: 1.0
  ee_ik_w_yaw: 0.3
  ee_ik_w_q: 0.1
  ee_ik_w_limit: 1.0
  ee_ik_w_gap: 2.0
  ee_ik_gap_ref: 0.20
  ee_ik_joint_margin_req: 0.087
  # ################################
  # YAML: EE 6D pose goal FSM / IK params end
  # ################################

# ################################
# YAML: RViz debug visualization (does not affect planning/collision) begin
# ################################
visualization:
  enable_debug_vis: false   # true: check balls + history traj + start/goal mesh
  enable_traj_mesh_vis: true  # true: keep front/back planning phantoms (downsampled)
  vis_rate_hz: 15.0         # model_vis mesh publish rate cap
  tf_rate_hz: 20.0          # model_vis TF broadcast rate (RobotModel)
  mesh_vis_stride: 3        # subsample front/back trajectory meshes
  his_traj_max_points: 500  # cap mm_his_traj marker growth
# ################################
# YAML: RViz debug visualization end
# ################################

grid_map:
  use_load_map: true     # Whether to use simulation map
  use_global_map: false # Whether to use global map
