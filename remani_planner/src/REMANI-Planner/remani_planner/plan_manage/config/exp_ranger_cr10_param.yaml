fsm:
  # ################################
  # YAML: Ranger+CR10 sim waypoints begin
  # ################################
  # target_type: 1 = RViz "2D Nav Goal" 手动给点; 2 = 按预设 waypoint 顺序
  waypoint_num : 2
  # [x, y, q1..q6 deg] — joints within conservative CR10 sim limits
