# ################################
# YAML: Ranger + CR10 smoke overlay — local MPC execution
# ################################
planner_node:
  agent:
    mode: "planner"
    planner: "moma"
    local_mode: true
    random_ee: true
    fixed_sequence: true
    fixed_startgoal: false
    scene: "smoke_open"
  # ################################
  # YAML: Ranger chassis is large; give front-end / OMPL enough time on smoke
  # ################################
  mcrrts:
    max_time: 2.0
    goal_sample_rate: 0.4
    check_colli_res: 0.01
  ompls:
    planner_type: "BiTRRT"
    plan_time: 5.0
    construct_time: 1800.0
    inter_time: 0.1
    use_inter: true
