  init_yaw               : 0.0
  init_gripper_close     : false
  waypoint0              : [2.5, 1.0, 0.0, -40.0, 80.0, 0.0, -40.0, 0.0]
  waypoint0_yaw          : -30.0
  waypoint0_gripper_close: true
  waypoint1              : [-1.0, -2.0, 0.0, -30.0, 60.0, 0.0, -30.0, 0.0]
  waypoint1_yaw          : -90.0
  waypoint1_gripper_close: false
  # ################################
  # YAML: Ranger+CR10 sim waypoints end
  # ################################
