# ################################
# YAML: Ranger + CR10 smoke map — deterministic wide-open free space
# ################################
map:
  obs_num: [30, 10]
  wall_size_range: [0.2, 0.8]
  wall_height_range: [0.4, 1.5]
  float_size_range: [0.3, 0.6]
  float_height_range: [0.4, 0.8]
  resolution: 0.05
  size_x: 20.0
  size_y: 20.0
  min_obs_dis: 1.0
  vis_rate: 1.0
  fix_generator: true
  desk_length_range: [0.75, 1.25]
  desk_width_range: [0.75, 1.25]
  desk_height_range: [0.5, 1.0]
  desk_arrangement_range: [1, 2]
  case_id: 0

# ################################
# YAML: Smoke planner map height must clear CR10 + AG95 upright spheres (~1.61 m)
# ################################
planner_node:
  grid_map:
    map_size_z: 2.5
