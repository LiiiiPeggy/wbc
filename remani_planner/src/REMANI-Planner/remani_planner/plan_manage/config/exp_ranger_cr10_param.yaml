map:
  map_type: 0 # 0: Cuboids (+ optional bridges via launch) 1: Bridge-only

fsm:
  # ################################
  # YAML: Ranger+CR10 sim waypoints with bridge corridor begin
  # ################################
  # target_type: 1 = RViz "2D Nav Goal"; 2 = preset waypoints
  waypoint_num : 2
  # Compact UP-fold for under-bridge (~1.25 m). Old [-30,120,...] dipped through deck
  # and triggered KinoAstar start(2) car-mani. Mount pose unchanged.
  # Path: start west of bridge @x=0 → through bridge → east side.
  init_state             : [-5.0, 0.0, 0.0, 0.0, -40.0, 130.0, 0.0, 30.0]
  init_yaw               : 0.0
  init_gripper_close     : false
  waypoint0              : [0.0, 0.0, 0.0, 0.0, -40.0, 130.0, 0.0, 30.0]
  waypoint0_yaw          : 0.0
  waypoint0_gripper_close: true
  waypoint1              : [5.0, 0.0, 0.0, 0.0, -45.0, 125.0, 0.0, 20.0]
  waypoint1_yaw          : 0.0
  waypoint1_gripper_close: false
  # ################################
  # YAML: Ranger+CR10 sim waypoints with bridge corridor end
  # ################################
