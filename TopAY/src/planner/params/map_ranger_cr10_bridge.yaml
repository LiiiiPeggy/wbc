# ################################
# YAML: Dedicated Ranger+CR10 bridge/arch map (does not alter ordinary smoke)
# ################################
map:
  obs_num: [20, 5, 4]
  wall_size_range: [0.2, 0.8]
  wall_height_range: [0.4, 1.5]
  float_size_range: [0.3, 0.6]
  float_height_range: [0.4, 0.8]
  resolution: 0.05
  size_x: 20.0
  size_y: 20.0
  min_obs_dis: 1.0
  vis_rate: 1.0
  fix_generator: true
  desk_length_range: [0.75, 1.25]
  desk_width_range: [0.75, 1.25]
  desk_height_range: [0.5, 1.0]
  desk_arrangement_range: [1, 2]
  case_id: 0
  bridge_enable: true
  # ################################
  # YAML: Wider span for 1.5 m tall pillars (arm must clear)
  # ################################
  bridge_opening_width_range: [2.8, 3.5]
  bridge_opening_depth_range: [0.20, 0.40]
  # ################################
  # YAML: Opening clearance (lintel bottom) 1.5 m
  # ################################
  bridge_clearance_range: [1.5, 1.5]
  bridge_lintel_thickness_range: [0.08, 0.15]
  bridge_pillar_width_range: [0.15, 0.30]

planner_node:
  grid_map:
    map_size_z: 2.5
