# ################################
# 仅仿真侧显示静态障碍（控制器避障关闭，避免双 hpp-fcl 崩溃）
# 用于场景可视化截图
# ################################
include:
  -
    key: simulation
    package: upright_cmd
    path: config/simulation.yaml
  -
    key: controller
    package: upright_cmd
    path: config/controller.yaml
  -
    package: upright_cmd
    path: config/robots/thing.yaml
  -
    package: upright_cmd
    path: config/obstacles/simple.yaml

logging:
  timestep: 0.010
  log_dir: /tmp/upright_logs/obstacles

simulation:
  duration: 0.5
  arrangement: pink_bottle
  static_obstacles:
    enabled: true
  cameras:
    overview:
      target: [0.5, 0.6, 0.4]
      position: [2.2, -1.5, 1.8]
    side:
      target: [0.5, 0.6, 0.5]
      position: [-1.5, 2.5, 1.2]
  photos:
    start:
      -
        camera: overview
        name: /tmp/upright_logs/obstacles/overview
      -
        camera: side
        name: /tmp/upright_logs/obstacles/side

controller:
  obstacles:
    enabled: false
  balancing:
    enabled: false
  waypoints:
    -
      time: 0
      position: [0, 0, 0]
      orientation: [0, 0, 0, 1]
