# ################################
# 本机避障可视化 demo：静态球形障碍 + MPC 硬约束避障
# ################################
include:
  -
    key: simulation
    package: upright_cmd
    path: config/simulation.yaml
  -
    key: controller
    package: upright_cmd
    path: config/controller.yaml
  -
    package: upright_cmd
    path: config/robots/thing.yaml
  -
    package: upright_cmd
    path: config/obstacles/simple.yaml

logging:
  timestep: 0.010
  log_dir: /tmp/upright_logs/obstacles

simulation:
  duration: 6.0
  arrangement: pink_bottle
  static_obstacles:
    enabled: true
  # 起止截图，便于查看避障场景
  photos:
    start:
      -
        camera: example3
        name: /tmp/upright_logs/obstacles/start
    end:
      -
        camera: example3
        name: /tmp/upright_logs/obstacles/end

controller:
  mpc:
    time_horizon: 2.0

  sqp:
    hpipm:
      slacks:
        enabled: true

  obstacles:
    enabled: true
    constraint_type: hard
    minimum_distance: 0.1

  balancing:
    enabled: true
    use_force_constraints: true
    frictionless: true
    arrangement: pink_bottle
    constraint_type: hard

  # 目标穿过障碍区附近，迫使绕障
  waypoints:
    -
      time: 0
      position: [-2.0, 1.0, 0]
      orientation: [0, 0, 0, 1]
